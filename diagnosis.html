<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Диагноз</title>

<!-- Source Sans Pro -->
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --main-color: #4A90E2;
  --light-color: #E6F0FA;
  --bg-color: #F2F8FF;
  --text-color: #1C2B4A;
  --highlight-color: #CDE6FF;
}

body {
  font-family: 'Source Sans Pro', Arial, sans-serif;
  margin: 40px;
  background: var(--bg-color);
  color: var(--text-color);
}

/* Назад */
a.back {
  display: inline-block;
  margin-bottom: 20px;
  text-decoration: none;
  color: var(--main-color);
  font-weight: 600;
}
a.back:hover { text-decoration: underline; }

/* Заголовок диагноза */
#title {
  font-size: 44px;
  font-weight: 700;
  margin-bottom: 6px;
}

#stats {
  margin-bottom: 20px;
  font-size: 16px;
}

/* Фильтр */
.filter {
  display: block;
  padding: 10px 14px;
  width: 360px;
  border-radius: 12px;
  border: 1px solid var(--main-color);
  margin-bottom: 10px;
  font-family: 'Source Sans Pro', Arial, sans-serif;
}

/* Кнопка скачивания */
.download-btn {
  display: block;
  background-color: var(--main-color);
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 14px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  margin-bottom: 30px;
}
.download-btn:hover {
  background-color: #357ABD;
}

/* Заголовки говорящих */
h2 {
  margin-top: 35px;
  font-size: 22px;
}

/* Таблицы — стандартный шрифт */
table {
  border-collapse: collapse;
  width: 100%;
  margin-top: 10px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
  background: white;
}

th, td {
  border: 1px solid #ccc;
  padding: 8px;
  text-align: left;
  font-family: Arial, sans-serif;
}

th { background-color: var(--light-color); }
tr:hover { background-color: var(--highlight-color); }

.low { background-color: #D9F0FF; }
.medium { background-color: #A3D2FF; }
.high { background-color: #4A90E2; color: white; }

audio { width: 180px; }
</style>
</head>

<body>

<a href="index.html" class="back">← Назад к меню</a>

<h1 id="title"></h1>
<p id="stats"></p>

<input
  type="text"
  id="filterInput"
  class="filter"
  placeholder="Фильтр по тексту, ID или комментариям"
>

<button id="downloadAll" class="download-btn">
  Скачать весь архив
</button>

<div id="tables"></div>

<script>
/* === Получаем диагноз === */
const params = new URLSearchParams(window.location.search);
const diagnosis = params.get('d');
document.getElementById('title').innerText = diagnosis;

/* === Загружаем метаданные === */
fetch('metadata.json')
.then(r => r.json())
.then(data => {

  const items = data.filter(x => x.diagnosis === diagnosis);
  const container = document.getElementById('tables');

  /* Группировка по говорящему */
  const grouped = {};
  items.forEach(x => {
    if (!grouped[x.speaker]) grouped[x.speaker] = [];
    grouped[x.speaker].push(x);
  });

  /* Создание таблицы */
  function createTable(speakerId, group) {
    const info = group[0];

    const h2 = document.createElement('h2');
    h2.innerHTML = `
      Говорящий ${speakerId} (файлов: ${group.length})<br>
      Пол: ${info.sex}<br>
      Возраст: ${info.age}<br>
      Образование: ${info.education}
    `;
    container.appendChild(h2);

    const table = document.createElement('table');
    table.innerHTML = `
      <thead>
        <tr>
          <th>ID файла</th>
          <th>Текст</th>
          <th>Длительность</th>
          <th>Комментарий</th>
          <th>Аудио</th>
          <th>TextGrid</th>
        </tr>
      </thead>
    `;

    const tbody = document.createElement('tbody');

    group.forEach(x => {
      let cls = 'low';
      if (x.diagnosis_comment?.toLowerCase().includes('умеренной')) cls = 'medium';
      if (x.diagnosis_comment?.toLowerCase().includes('тяжелой')) cls = 'high';

      const tr = document.createElement('tr');
      tr.className = cls;

      tr.innerHTML = `
        <td>${x.id}</td>
        <td>${x.text}</td>
        <td>—</td>
        <td>${x.diagnosis_comment || ''}</td>
        <td>
          <audio controls src="${x.audio_url}"></audio>
        </td>
        <td>
          <a href="${x.textgrid_url}" download>Скачать</a>
        </td>
      `;

      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    container.appendChild(table);

    /* Автодлительность */
    table.querySelectorAll('audio').forEach((a, i) => {
      a.onloadedmetadata = () => {
        tbody.rows[i].cells[2].innerText = a.duration.toFixed(1);
        updateStats();
      };
    });
  }

  Object.keys(grouped).forEach(id => createTable(id, grouped[id]));

  /* Статистика */
  function updateStats() {
    let files = 0, dur = 0;
    document.querySelectorAll('tbody tr').forEach(r => {
      const d = parseFloat(r.cells[2].innerText);
      if (!isNaN(d) && r.style.display !== 'none') {
        files++; dur += d;
      }
    });
    document.getElementById('stats').innerText =
      `Файлов: ${files}, общая длительность: ${dur.toFixed(1)} сек`;
  }

  /* Фильтр */
  document.getElementById('filterInput').addEventListener('input', e => {
    const f = e.target.value.toLowerCase();
    document.querySelectorAll('tbody tr').forEach(r => {
      r.style.display = r.innerText.toLowerCase().includes(f) ? '' : 'none';
    });
    updateStats();
  });

});

/* === КНОПКА "Скачать весь архив" (Google Drive) === */
document.getElementById('downloadAll').addEventListener('click', () => {

  const diagnosis = new URLSearchParams(window.location.search).get('d');

  const driveFolders = {
    "Болезнь Альцгеймера": "I1VuHYbLRQWTbruKh5iyOxCg2M1JZJf85S",
    "Церебральный атеросклероз": "-"
  };

  const folderId = driveFolders[diagnosis];
  if (!folderId) {
    alert("Папка для этого диагноза не найдена");
    return;
  }

  window.open(
    `https://drive.google.com/drive/folders/${folderId}`,
    "_blank"
  );
});
</script>

</body>
</html>
